<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Tool - Đăng nhập</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2430;--mut:#6b7686;--bd:#dfe3ea;--pri:#2f6fed;--pri-fg:#fff;--err:#c8372d}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--fg:#e6eaf0;--mut:#93a0b2;--bd:#2b3441;--pri:#5b92ff;--pri-fg:#0b1220;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;width:min(380px,100%);display:grid;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--mut);font-size:13px}
input,button{font:inherit;border-radius:8px;padding:9px 12px;border:1px solid var(--bd);width:100%}
input{background:var(--bg);color:var(--fg)}
button{background:var(--pri);color:var(--pri-fg);border-color:var(--pri);cursor:pointer}
button:disabled{opacity:.5}
#err{color:var(--err);font-size:13px;min-height:1.2em}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<form id="f">
  <h1>Prompt Tool</h1>
  <p>Nhập mã truy cập. Lấy mã bằng lệnh <code>python3 prompt_tool.py token</code> trên máy chạy service.</p>
  <input id="t" type="password" placeholder="Mã truy cập" autocomplete="current-password" autofocus required>
  <div id="err"></div>
  <button id="b">Đăng nhập</button>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "prompt-tool"}, body: JSON.stringify({token: document.getElementById("t").value})});
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.reload(); return; }
    err.textContent = d.error || ("Lỗi " + r.status);
  } catch (e) { err.textContent = "Không kết nối được tới service."; }
  b.disabled = false;
});
</script>
</body>
</html>
